<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Website</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<header>
    <div class="navbar">
        <h2>BEAUTY.</h2>

        <ul class="menu">
            <li>Home</li>
            <li>Shop</li>
            <li>Skincare</li>
            <li>Makeup</li>
        </ul>

        <button class="btn">Sign In</button>
    </div>
</header>

<!-- HERO -->
<section class="hero">
    <div class="hero-text">
        <h1>Glow like <br> never before!</h1>
        <button class="btn">Shop Now</button>
    </div>

    <div class="hero-img">
        <img src="https://images.unsplash.com/photo-1596462502278-27bfdc403348">
        <img src="https://images.unsplash.com/photo-1585386959984-a41552231658">
        <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519">
    </div>
</section>

<!-- FEATURED -->
<section class="featured">
    <h2>Featured Product</h2>

    <div class="cards">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1585238342028-4c6e1c3f3b7e">
            <p>Lipstick</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519">
            <p>Serum</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1596462502278-27bfdc403348">
            <p>Foundation</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1585386959984-a41552231658">
            <p>Powder</p>
        </div>
    </div>
</section>

<!-- PROMO -->
<section class="promo">
    <div class="promo-text">
        <h2>Spring Beauty Sale</h2>
        <p>Up to 40% Off</p>
        <button class="btn">Shop Now</button>
    </div>

    <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519">
</section>

<!-- BLOG -->
<section class="blog">
    <div class="blog-card">
        <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9">
        <p>Makeup Tips</p>
    </div>

    <div class="blog-card">
        <img src="https://images.unsplash.com/photo-1556228578-0d85b1a4d571">
        <p>Skincare Routine</p>
    </div>

    <div class="blog-card">
        <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9">
        <p>Beauty Secrets</p>
    </div>
</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 Beauty Website</p>
</footer>

</body>
</html>
