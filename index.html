<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Website</title>
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<header>
    <div class="navbar">
        <h2>BEAUTY.</h2>
        <ul>
            <li>Home</li>
            <li>Shop</li>
            <li>Skincare</li>
            <li>Makeup</li>
        </ul>
        <button class="btn">Sign In</button>
    </div>
</header>

<!-- Hero Section -->
<section class="hero">
    <div class="hero-text">
        <h1>Glow like <br> never before!</h1>
        <button class="btn">Shop Now</button>
    </div>

    <div class="hero-img">
        <img src="https://via.placeholder.com/250" alt="">
        <img src="https://via.placeholder.com/150" alt="">
        <img src="https://via.placeholder.com/120" alt="">
    </div>
</section>

<!-- Featured Product -->
<section class="featured">
    <h2>Featured Product</h2>
    <div class="cards">

        <div class="card">
            <img src="https://via.placeholder.com/120">
            <p>Product 1</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/120">
            <p>Product 2</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/120">
            <p>Product 3</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/120">
            <p>Product 4</p>
        </div>

    </div>
</section>

<!-- Promo Section -->
<section class="promo">
    <div class="promo-text">
        <h2>Spring Beauty Sale</h2>
        <p>Up to 40% Off</p>
        <button class="btn">Shop Now</button>
    </div>

    <img src="https://via.placeholder.com/200">
</section>

<!-- Blog Section -->
<section class="blog">
    <div class="blog-card">
        <img src="https://via.placeholder.com/200">
        <p>Makeup Tips</p>
    </div>

    <div class="blog-card">
        <img src="https://via.placeholder.com/200">
        <p>Skincare Routine</p>
    </div>

    <div class="blog-card">
        <img src="https://via.placeholder.com/200">
        <p>Beauty Secrets</p>
    </div>
</section>

<!-- Footer -->
<footer>
    <p>© 2026 Beauty Website</p>
</footer>

</body>
</html>
